<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Condominio360{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'inicio' %}">Condominio360</a>
    {% if user.is_authenticated %}
    <ul class="navbar-nav me-auto">
        {% if perms.gasto.view_gasto %}<li class="nav-item"><a class="nav-link" href="{% url 'gasto:lista' %}">Gastos</a></li>{% endif %}
    </ul>
    <span class="navbar-text me-3">{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </form>
    {% endif %}
</nav>
<div class="container mt-4">
    {% block contenido %}{% endblock %}
</div>
</body>
</html>
